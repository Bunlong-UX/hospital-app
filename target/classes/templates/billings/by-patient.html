<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Billing History - Hospital MS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f0f2f5; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: 250px; min-height: 100vh; background: #1a2035; position: fixed; top: 0; left: 0; z-index: 100; }
        .sidebar-brand { padding: 1.5rem 1.25rem; border-bottom: 1px solid rgba(255,255,255,0.08); color: white; font-weight: 700; font-size: 1.1rem; }
        .sidebar-brand span { color: #4da3ff; }
        .sidebar nav { padding: 1rem 0; }
        .sidebar a { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1.25rem; color: #c8cfe8; text-decoration: none; transition: all 0.2s; font-size: 0.92rem; }
        .sidebar a:hover { background: #2d3654; color: white; }
        .sidebar a.active { background: #0d6efd; color: white; border-radius: 0 8px 8px 0; margin-right: 12px; }
        .sidebar a i { font-size: 1.1rem; width: 20px; }
        .sidebar-section { padding: 0.5rem 1.25rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: #5a6385; margin-top: 0.5rem; }
        .main-content { margin-left: 250px; padding: 2rem; }
        .topbar { background: white; padding: 1rem 2rem; margin: -2rem -2rem 2rem; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .card-header { background: white; border-bottom: 1px solid #f0f2f5; font-weight: 600; border-radius: 12px 12px 0 0 !important; padding: 1rem 1.5rem; }
        .table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d; font-weight: 600; }
        .table td { vertical-align: middle; }
        .status-PAID { background: #e8f5e9; color: #2e7d32; }
        .status-UNPAID { background: #fce4ec; color: #c62828; }
        .status-PENDING { background: #fff8e1; color: #f57f17; }
    </style>
</head>
<body>
<div class="sidebar">
    <div class="sidebar-brand">🏥 <span>Hospital</span> MS</div>
    <nav>
        <a href="/"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <div class="sidebar-section">Management</div>
        <a href="/patients"><i class="bi bi-people"></i> Patients</a>
        <a href="/doctors"><i class="bi bi-person-badge"></i> Doctors</a>
        <a href="/appointments"><i class="bi bi-calendar-check"></i> Appointments</a>
        <a href="/billings"><i class="bi bi-receipt"></i> Billing</a>
        <a href="/inventory"><i class="bi bi-box-seam"></i> Inventory</a>
        <div class="sidebar-section">Reports</div>
        <a href="/appointments/by-patient?patientId="><i class="bi bi-person-lines-fill"></i> Appt by Patient</a>
        <a href="/appointments/by-doctor?doctorId="><i class="bi bi-stethoscope"></i> Appt by Doctor</a>
        <a href="/billings/by-patient?patientId=" class="active"><i class="bi bi-cash-stack"></i> Billing History</a>
        <a href="/billings/unpaid"><i class="bi bi-exclamation-circle"></i> Unpaid Bills</a>
        <a href="/inventory/near-expiration"><i class="bi bi-clock-history"></i> Near Expiration</a>
    </nav>
</div>

<div class="main-content">
    <div class="topbar">
        <h5 class="mb-0 fw-bold"><i class="bi bi-cash-stack me-2 text-primary"></i>Billing History by Patient</h5>
    </div>

    <div class="card mb-4">
        <div class="card-body py-3">
            <form method="get" action="/billings/by-patient" class="d-flex gap-2 align-items-center">
                <label class="fw-semibold text-nowrap me-2">Select Patient:</label>
                <select name="patientId" class="form-select">
                    <option value="">-- Choose a patient --</option>
                    <option th:each="p : ${patients}"
                            th:value="${p.id}"
                            th:text="${p.firstName + ' ' + p.lastName}"
                            th:selected="${p.id == selectedPatientId}">Patient</option>
                </select>
                <button type="submit" class="btn btn-primary px-4">Filter</button>
            </form>
        </div>
    </div>

    <div class="card" th:if="${billings != null}">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>Billing Records</span>
            <span class="badge bg-primary rounded-pill" th:text="${billings.size()} + ' records'">0</span>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Patient</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${billings.empty}">
                        <td colspan="4" class="text-center text-muted py-4">No billing records for this patient.</td>
                    </tr>
                    <tr th:each="b : ${billings}">
                        <td class="fw-semibold" th:text="${b.patientName}">-</td>
                        <td class="fw-bold" th:text="'$' + ${#numbers.formatDecimal(b.amount, 1, 2)}">-</td>
                        <td th:text="${b.billingDate}">-</td>
                        <td>
                            <span class="badge rounded-pill px-3 py-1"
                                  th:classappend="'status-' + ${b.paymentStatus}"
                                  th:text="${b.paymentStatus}">-</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
